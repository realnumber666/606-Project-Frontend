<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="home_styles.css">
</head>
<body>
    <h1>Expense Tracker</h1>

    <div class="expense-form">
        <h2>Add New Expense</h2>
        <form id="expense-form">
            <label for="amount">Amount ($):</label>
            <input type="number" id="amount" step="0.01" required>
            <label for="description">Description (Optional):</label>
            <input type="text" id="description">
            
            <label for="datetime">Datetime:</label>
            <input type="datetime-local" id="datetime" required>

            
            <label for="category">Category:</label>
            <select id="category" required>
                <option value="Transportation">Transportation</option>
                <option value="Food">Food</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Gadget purchase">Gadget purchase</option>
                <option value="Utilities">Utilities</option>
                <option value="Rent">Rent</option>
                <option value="Medical">Medical</option>
                <option value="Gifts">Gifts</option>
                <option value="Other">Other</option>
            </select>
            
            <button type="submit">Add Expense</button>
        </form>
        <div id="message" class="message"></div>
    </div>

    <div class="expense-list">
        <label for="month-picker">Select Month:</label>
        <input type="month" id="month-picker">
        <button id="edit-budget-btn">Edit Current Month Budget</button></p>
    
        <h2>Expense List</h2>
        <p>Total Expenses: <span id="total-expenses">$0.00</span></p>
        <p>Monthly Budget: <span id="monthly-budget">$0.00</span> 
    
        <div id="budgetModal" class="modal">
            <div class="modal-content">
                <label for="budget-input">Edit Monthly Budget:</label>
                <input type="number" id="budget-input" step="0.01">
                <button id="save-budget-btn">Save</button>
            </div>
        </div>
    
        <ul id="expense-items"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
